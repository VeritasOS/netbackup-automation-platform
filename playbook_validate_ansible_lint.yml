- name: Validate project with ansible-lint
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_lint_plain_log: "{{ playbook_dir }}/.ansible-lint-last.plain.out"
    ansible_lint_summary_file: "{{ playbook_dir }}/.ansible-lint-summary.txt"
    ansible_lint_report_file: "{{ playbook_dir }}/.ansible-lint-report.txt"
    ansible_lint_skipped_rules_file: "{{ playbook_dir }}/.ansible-lint-skipped-rules.txt"
    report_rule: ================================================================================
  tasks:
    - name: Run ansible-lint from project root
      ansible.builtin.shell: |
        set -o pipefail
        cd "{{ playbook_dir }}"
        ansible-lint 2>&1 | tee "{{ playbook_dir }}/.ansible-lint-last.out"
        exit ${PIPESTATUS[0]}
      args:
        executable: /bin/bash
      environment:
        ANSIBLE_INVENTORY: localhost,
        NO_COLOR: "1"
        FORCE_COLOR: "0"
        TERM: dumb
        PY_COLORS: "0"
        CLICOLOR: "0"
      register: lint_run
      failed_when: false
      changed_when: false

    - name: Strip terminal formatting for stable parsing and AAP display
      ansible.builtin.shell: |
        set -euo pipefail
        # awk is available in AAP EEs; perl often is not
        awk '{
          gsub(/\033\[[0-9;]*[a-zA-Z]/, "")
          gsub(/\033\]8;[^\033]*\033\\/, "")
          print
        }' "{{ playbook_dir }}/.ansible-lint-last.out" > "{{ ansible_lint_plain_log }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Extract Rule Violation Summary table
      ansible.builtin.shell: |
        set -euo pipefail
        awk '
          /Rule Violation Summary/ { show=1 }
          show && /^Failed:/ { exit }
          show { print }
        ' "{{ ansible_lint_plain_log }}" | sed '/^[[:space:]]*$/d' > "{{ ansible_lint_summary_file }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Format ansible-lint report (CLI and AAP use the same file)
      ansible.builtin.shell: |
        set -euo pipefail
        status_line="$(grep -E '^(Passed|Failed):' "{{ ansible_lint_plain_log }}" | tail -1 || true)"
        {
          printf '%s\n' "{{ report_rule }}"
          printf '%s\n' '                         ANSIBLE-LINT REPORT'
          printf '%s\n' "{{ report_rule }}"
          printf 'Project : %s\n' "{{ playbook_dir }}"
          printf 'Command : ansible-lint\n'
          printf 'Exit    : %s\n' "{{ lint_run.rc }}"
          printf '\n'
          if [ -s "{{ ansible_lint_summary_file }}" ]; then
            cat "{{ ansible_lint_summary_file }}"
          else
            printf '%s\n' '(No Rule Violation Summary table produced.)'
          fi
          printf '\n'
          if [ -n "$status_line" ]; then
            printf '%s\n' "$status_line"
          fi
          printf '\n'
          printf '%s\n' "{{ report_rule }}"
        } > "{{ ansible_lint_report_file }}"
      args:
        executable: /bin/bash
      changed_when: false

    # One debug line per report row — same text as `cat .ansible-lint-report.txt` (no embedded \\n JSON blob).
    - name: Display ansible-lint report
      ansible.builtin.debug:
        msg: "{{ item if item | length > 0 else ' ' }}"
      loop: "{{ lookup('file', ansible_lint_report_file).split('\n') }}"
      loop_control:
        label: ""
      changed_when: false

    - name: Build skipped ansible-lint rules statement from .ansible-lint
      ansible.builtin.shell: |
        set -euo pipefail
        cfg="{{ playbook_dir }}/.ansible-lint"
        out="{{ ansible_lint_skipped_rules_file }}"
        if [ ! -f "$cfg" ]; then
          {
            printf '%s\n' "{{ report_rule }}"
            printf '%s\n' '                    SKIPPED ANSIBLE-LINT RULES'
            printf '%s\n' "{{ report_rule }}"
            printf '%s\n' "WARNING: ${cfg} not found; no skip_list to display."
            printf '%s\n' "{{ report_rule }}"
          } > "$out"
          exit 0
        fi
        profile="$(awk '/^profile:/ { print $2; exit }' "$cfg")"
        skip_count="$(awk '/^skip_list:/ { inlist=1; next } inlist && /^  - / { c++ } inlist && /^[^ #]/ && !/^  - / { exit } END { print c+0 }' "$cfg")"
        {
          printf '%s\n' "{{ report_rule }}"
          printf '%s\n' '                    SKIPPED ANSIBLE-LINT RULES'
          printf '%s\n' "{{ report_rule }}"
          printf 'Profile : %s\n' "${profile:-not set}"
          printf 'Source  : %s\n' "$cfg"
          printf 'Count   : %s\n' "$skip_count"
          printf '\n'
          printf '%s\n' 'Rules in skip_list (not enforced as failures):'
          awk '
            /^skip_list:/ { inlist=1; next }
            inlist && /^  - / { sub(/^  - /, ""); printf "  - %s\n", $0; next }
            inlist && /^[^ #]/ { exit }
          ' "$cfg"
          printf '\n'
          printf '%s\n' "{{ report_rule }}"
        } > "$out"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Display skipped ansible-lint rules
      ansible.builtin.debug:
        msg: "{{ lookup('file', ansible_lint_skipped_rules_file) }}"
      changed_when: false

    - name: Fail when ansible-lint reported violations
      ansible.builtin.fail:
        msg: ansible-lint failed (exit code {{ lint_run.rc }}).
      when: lint_run.rc != 0

# EOF
