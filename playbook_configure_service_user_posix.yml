# NetBackup – Configure service user (POSIX: Linux, Solaris, AIX, and other unixes)
# Loads vars/linux.yml and role netbackup/posix.

- name: NETBACKUP -> CONFIGURE SERVICE USER ("Linux")
  gather_facts: true
  become: true
  hosts: all
  pre_tasks:
    - name: Retrieving host distribution
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - "distribution"

    - name: "CONFIGURE-SERVICE-USER -> Load configurable variables"
      ansible.builtin.include_vars: "vars/linux.yml"
      tags: ["always"]
      no_log: true

  roles:
    - role: 'netbackup'
    - role: 'netbackup/posix'
    - role: 'generic/is_nbu_version_supported'
    - role: 'helper/nbu_role_status'
    - role: 'netbackup/common/evaluate_service_user/v2.0'
    - role: 'generic/is_nbu_installed'
    - role: 'netbackup/common/nbu_change_serviceuser/v2.0'

  vars:
    nbu_playbook_type: "service_user"

# EOF
