# NetBackup Server - Install - CLIENT
- name: NETBACKUP -> CLIENT INSTALL ("Linux")
  gather_facts: true
  become: true
  hosts: all
  environment:
    NB_TMPDIR: "/usr/openv/tmp"
    PAR_GLOBAL_TMPDIR: "/usr/openv/tmp"
  pre_tasks:
    - name: Retrieving host distribution
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - "distribution"

    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Load configurable variables"
      ansible.builtin.include_vars: "vars/linux.yml"
      tags: ["always"]
      no_log: true

  roles:
    - role: 'netbackup' # Load netbackup common defaults
    - role: 'netbackup/posix' # Load netbackup default vars
    - role: 'generic/is_nbu_version_supported'
    - role: 'generic/os_compatibility'
    - role: 'netbackup/common/evaluate_service_user/v2.0' # Evaluate/ensure NetBackup service OS user/group before client install
    - role: 'helper/detect_partial_install'
    - role: 'generic/nbu_compatibility'
    - role: 'netbackup/posix/nbu_client_install/v2.0'
    - role: 'netbackup/common/nbu_change_serviceuser/v2.0'
    - role: 'netbackup/common/nbu_get_certificate/v2.0'
    - role: 'generic/nbu_verification' # Verifies certificate specific checks and report
    - role: 'netbackup/posix/nbu_eeb_mgmt/v2.0'

  vars:
    nbu_role: "client"
    nbu_playbook_type: "install"

# EOF
