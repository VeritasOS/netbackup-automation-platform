name: Generate Release Checksums

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to archive (e.g. v4.1a)
        required: true
        type: string

jobs:
  generate-checksum:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload assets to the release
    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag_name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Create Source Archive & Generate Checksum
        id: archive
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.release.outputs.tag_name }}"
          SAFE_TAG="${TAG_NAME//\//-}"
          PREFIX="netbackup-automation-platform-${SAFE_TAG}/"
          ARCHIVE_NAME="netbackup-automation-platform-${SAFE_TAG}.tar.gz"
          ZIP_NAME="netbackup-automation-platform-${SAFE_TAG}.zip"

          # git archive avoids tar writing the archive into the tree being archived
          # (which causes: tar: .: file changed as we read it)
          git archive --format=tar.gz --prefix="$PREFIX" HEAD > "$ARCHIVE_NAME"
          git archive --format=zip --prefix="$PREFIX" HEAD > "$ZIP_NAME"

          sha256sum "$ARCHIVE_NAME" "$ZIP_NAME" > checksums.txt
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Checksums to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            checksums.txt
            ${{ steps.archive.outputs.archive_name }}
            ${{ steps.archive.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
