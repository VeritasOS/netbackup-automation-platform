name: Generate Release Checksums

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (e.g. v4.1a)
        required: true
        type: string

jobs:
  generate-checksum:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag_name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download GitHub source archives and generate checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          WORKDIR="${RUNNER_TEMP}/release-checksums"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          REPO="${GITHUB_REPOSITORY#*/}"
          TAG_SUFFIX="${TAG_NAME#v}"
          BASE="${REPO}-${TAG_SUFFIX}"
          TAR_NAME="${BASE}.tar.gz"
          ZIP_NAME="${BASE}.zip"

          TAR_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG_NAME}.tar.gz"
          ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG_NAME}.zip"

          wait_for_url() {
            local url="$1"
            local label="$2"
            for attempt in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w "%{http_code}" -L -H "$AUTH" "$url" || true)"
              if [ "$code" = "200" ]; then
                echo "${label} available"
                return 0
              fi
              echo "Waiting for ${label} (HTTP ${code}), attempt ${attempt}/30..."
              sleep 10
            done
            echo "Timed out waiting for ${label}: ${url}" >&2
            return 1
          }

          wait_for_url "$TAR_URL" "tarball"
          wait_for_url "$ZIP_URL" "zipball"

          curl -fsSL -H "$AUTH" -o "$TAR_NAME" "$TAR_URL"
          curl -fsSL -H "$AUTH" -o "$ZIP_NAME" "$ZIP_URL"

          sha256sum "$TAR_NAME" "$ZIP_NAME" > checksums.txt
          cat checksums.txt
          cp checksums.txt "${GITHUB_WORKSPACE}/checksums.txt"

      - name: Upload checksums.txt to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
