#######################################################################
#### nbu_server_install -> tasks -> t03_archive_pack_on_upgrade.yml ####
#######################################################################
# Archives pack to pack.<pre-upgrade-version> before installing EEBs for a
# new NetBackup release during cross-version upgrades. Uses nbu_version_pre_upgrade
# captured during PRE-phase install verification (before base upgrade).
# Copies pack/* into pack.<version>/ (not pack.<version>/pack/) then removes pack/.
# Uses copy (remote_src) + file absent because Ansible core has no rename/move
# module for directories.

- name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Check whether {{ nbu_pack_dir_path }} exists"
  ansible.builtin.stat:
    path: "{{ nbu_pack_dir_path }}"
  register: nbu_pack_dir_register

- name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Archive pack directory when no pre-upgrade version is detected"
  when:
    - nbu_pack_dir_register.stat.exists
    - nbu_pack_dir_register.stat.isdir
    - nbu_current_installed_version is not defined
  block:
    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Set versioned pack archive path"
      ansible.builtin.set_fact:
        nbu_pack_undef_path: "{{ (os_path_nbu_install | default(os_path_nbu_install_default)) }}/pack.undefined"

    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Create versioned pack archive directory {{ nbu_pack_undef_path }}"
      ansible.builtin.file:
        path: "{{ nbu_pack_undef_path }}"
        state: directory
        mode: '0755'

    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Copy contents of {{ nbu_pack_dir_path }} to {{ nbu_pack_undef_path }}"
      ansible.builtin.copy:
        src: "{{ nbu_pack_dir_path }}/"
        dest: "{{ nbu_pack_undef_path }}/"
        remote_src: true
        mode: preserve
      register: nbu_pack_copy_register

    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Remove original pack directory {{ nbu_pack_dir_path }}"
      ansible.builtin.file:
        path: "{{ nbu_pack_dir_path }}"
        state: absent
      when: nbu_pack_copy_register is succeeded

- name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Rename pack directory only when pre-upgrade version is lower than proposed"
  when:
    - nbu_pack_dir_register.stat.exists
    - nbu_pack_dir_register.stat.isdir
    - nbu_current_installed_version is defined
    - nbu_current_installed_version | trim | length > 0
    - nbu_current_installed_version is version_compare(nbu_version, '<')
  block:
    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Set versioned pack archive path"
      ansible.builtin.set_fact:
        nbu_pack_archive_path: "{{ (os_path_nbu_install | default(os_path_nbu_install_default)) }}/pack.{{ nbu_current_installed_version }}"

    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Create versioned pack archive directory {{ nbu_pack_archive_path }}"
      ansible.builtin.file:
        path: "{{ nbu_pack_archive_path }}"
        state: directory
        mode: '0755'

    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Copy contents of {{ nbu_pack_dir_path }} to {{ nbu_pack_archive_path }}"
      ansible.builtin.copy:
        src: "{{ nbu_pack_dir_path }}/"
        dest: "{{ nbu_pack_archive_path }}/"
        remote_src: true
        mode: preserve
      register: nbu_pack_archive_copy_register

    - name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Remove original pack directory {{ nbu_pack_dir_path }}"
      ansible.builtin.file:
        path: "{{ nbu_pack_dir_path }}"
        state: absent
      when: nbu_pack_archive_copy_register is succeeded

# EOF
