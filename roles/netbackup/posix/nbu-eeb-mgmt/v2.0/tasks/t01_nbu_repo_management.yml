# Configure NetBackup yum/zypper package repository (EEB-only playbook; install/upgrade already configure repo)
- name: "NBU-EEB-INSTALL -> Set Artifactory Repository based on type of environment as Fact"
  ansible.builtin.set_fact:
    artifactory_repo: ""

- name: "NBU-EEB-INSTALL -> Define Artifactory Repository based on type of environment"
  block:
    - name: "NBU-EEB-INSTALL -> Define Artifactory Repository - DEV"
      ansible.builtin.set_fact:
        artifactory_repo: yum-enterprise-dev-local/
      when: "'DEV' in awx_inventory_name"

    - name: "NBU-EEB-INSTALL -> Define Artifactory Repository - UAT"
      ansible.builtin.set_fact:
        artifactory_repo: yum-enterprise-test-local/
      when: "'UAT' in awx_inventory_name"

    - name: "NBU-EEB-INSTALL -> Define Artifactory Repository - PROD"
      ansible.builtin.set_fact:
        artifactory_repo: yum-enterprise-prod-local/
      when:
        - "'PROD' in awx_inventory_name"
  when: awx_inventory_name is defined and awx_inventory_name != ""

- name: "NBU-EEB-INSTALL -> Clearing yum cache"
  block:
    - name: "NBU-EEB-INSTALL -> Check if {{ os_path_nbu_yum_cache }} exists"
      ansible.builtin.stat:
        path: "{{ os_path_nbu_yum_cache }}"
      register: yum_cache_register
      failed_when: false
      changed_when: false

    - name: "NBU-EEB-INSTALL -> Remove the NetBackup yum cache directory"
      ansible.builtin.file:
        path: "{{ os_path_nbu_yum_cache }}"
        state: absent
      failed_when: false
      when: ( ansible_distribution_major_version == '7' and yum_cache_register.stat.exists )
  when: ansible_system == 'Linux'

- name: "NBU-EEB-INSTALL -> Add YUM repository for NetBackup Software"
  ansible.builtin.yum_repository:
    name: netbackup
    description: "NetBackup {{ nbu_version }} Binaries"
    baseurl: "{{ nbu_artifactory_repo_base_url }}{{ artifactory_repo }}{{ nbu_path_repo_base_pkg }}"
    enabled: no
    gpgcheck: no
    state: present
    sslverify: no
  when:
    - ansible_os_family == 'RedHat'

- name: "NBU-EEB-INSTALL -> Add zypper repository for NetBackup Software"
  community.general.zypper_repository:
    name: netbackup
    repo: "{{ nbu_artifactory_repo_base_url }}{{ artifactory_repo }}{{ nbu_path_repo_base_pkg }}"
    state: present
    disable_gpg_check: yes
    enabled: yes
  when:
    - ansible_os_family == 'Suse'

