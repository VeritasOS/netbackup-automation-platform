# This workflow will perform pre-upgrade OS tasks

# Set ulimit for nbwebsvc is not set
- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Set OS ulimit for nbwebsvc user"
  ansible.builtin.lineinfile:
    dest: '{{ os_file_security_limits }}'
    line: "{{ item }}"
    create: yes
  with_items:
    - "{{ nbu_config_nbwebsvc_limit }}"

# Validate webservices vars before creating accounts.
- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Validate required NetBackup webservices account variables (primary)"
  ansible.builtin.fail:
    msg:
      - "Primary requires nbu_webservices_group and nbu_webservices_user to be set."
      - "nbu_webservices_group: {{ nbu_webservices_group }}"
      - "nbu_webservices_user: {{ nbu_webservices_user }}"
  when:
    - ( nbu_webservices_group | length == 0 ) or ( nbu_webservices_user | length == 0 )

- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Check if NetBackup Web Services group exists"
  ansible.builtin.shell: getent group {{ nbu_webservices_group }}
  register: nbu_ws_group_getent
  failed_when: false

- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Add new local group for NetBackup Web Services Group - {{ nbu_webservices_group }}"
  ansible.builtin.group:
    name: '{{ nbu_webservices_group }}'
    state: present
  when: nbu_ws_group_getent.rc != 0

- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Check if service and database users exist"
  ansible.builtin.shell: getent passwd {{ item }}
  with_items:
    - "{{ nbu_webservices_user }}"
    - "{{ nbu_services_user }}"
    - "{{ nbu_database_user }}"
  register: user_check_results
  failed_when: false

- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Add new web service user {{ nbu_webservices_user }} and add it to NetBackup Web Services Group - {{ nbu_webservices_group }}"
  ansible.builtin.user:
    name: '{{ nbu_webservices_user }}'
    comment: NetBackup Web Services
    group: '{{ nbu_webservices_group }}'
  when:
    - user_check_results.results[0].rc != 0

- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Verify '{{ nbu_webservices_group }}' is NOT the primary group of '{{ nbu_services_user }}'"
  ansible.builtin.shell: id -gn {{ nbu_services_user }}
  register: primary_group_check_register
  failed_when: false

- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Fail if '{{ nbu_webservices_group }}' is the primary group"
  ansible.builtin.fail:
    msg: "The group '{{ nbu_webservices_group }}' is currently the primary group for '{{ nbu_services_user }}'. nbcheck requires it to be a secondary group. Please change the user's primary group on the OS."
  when: 
    - primary_group_check_register.rc == 0
    - primary_group_check_register.stdout | default('') == nbu_webservices_group

- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Add NetBackup Web Services group membership to NetBackup service account"
  ansible.builtin.user:
    name: '{{ nbu_services_user }}'
    groups: '{{ nbu_webservices_group }}'
    append: true

# OS - Configure netbackup database user account
- name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Create new  database user {{ nbu_database_user }}for NetBackup Database User Account"
  ansible.builtin.user:
    name: '{{ nbu_database_user }}'
    comment: NetBackup database user account
  when:
    - user_check_results.results[2].rc != 0

# EOF
