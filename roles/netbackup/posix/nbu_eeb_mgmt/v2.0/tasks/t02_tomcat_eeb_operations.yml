###############################################################
#### nbu_eeb_mgmt -> tasks -> t02_tomcat_eeb_operations.yml ####
###############################################################

- name: "NBU-EEB-MGMT -> Set flag indicating a Tomcat EEB was processed"
  ansible.builtin.set_fact:
    tomcat_eeb_processed: true

# Tomcat EEB install and rollback operations share readme parsing, version facts,
# backup folder resolution, and Tomcat version detection in the common section below.
# Install runs TomcatDeployer.sh and creates a "<id>_<ver>.tomcat" marker for idempotency.
# Uninstall restores bin/lib (wmc/webserver) and conf (wsl/webserver/conf) from the
# bkpcomp backup before eebinstaller -uninstall (handled by the caller).

# The "<id>_<ver>.tomcat" marker file is created at the end of a successful TomcatDeployer.sh run.
# If it already exists for the current EEB, TomcatDeployer.sh must NOT run again.
- name: "NBU-EEB-MGMT -> Verify existence of {{ nbu_eeb_file_id }}_{{ nbu_eeb_file_ver }}.tomcat"
  ansible.builtin.stat:
    path: "{{ os_path_openv_tmp }}/{{ nbu_eeb_file_id }}_{{ nbu_eeb_file_ver }}.tomcat"
  register: tomcat_eeb_marker_register
  when: ( eeb_task_type == "install" )

- name: "Ansible::Log.info"
  ansible.builtin.debug:
    msg: "The TomcatDeployer.sh has already been executed successfully ({{ nbu_eeb_file_id }}_{{ nbu_eeb_file_ver }})"
  when:
    - ( eeb_task_type == "install" )
    - tomcat_eeb_marker_register.stat.exists

- name: "NBU-EEB-MGMT -> Resolve Tomcat EEB readme and backup facts"
  block:
    - name: "NBU-EEB-MGMT -> Extract NetBackup version from EEB readme - {{ eeb_name }}"
      ansible.builtin.shell: >
        {{ eeb_installer_path }} -r
        | awk '/Veritas Bug ID:/{flag=1; next} /NetBackup( Primary)? Server/{flag=0} flag'
        | awk -F '_' '{print $2}'
        | tr -d "\n"
        | awk -F ' ' '{print $1}'
      register: eeb_readme_nbu_version_register
      changed_when: false
      failed_when: false

    - name: "Ansible::Log.info"
      ansible.builtin.assert:
        that:
          - eeb_readme_nbu_version_register.stdout is match('^\\d+\\.\\d+(\\.\\d+){0,2}$')
        fail_msg:
          - "Failed to extract a valid NetBackup version from EEB readme ({{ eeb_installer_path }} -r)."
          - "Parsed value: '{{ eeb_readme_nbu_version_register.stdout | default('') }}'"
        quiet: true

    # Normalize the readme version by stripping trailing ".0" segments while
    # preserving at least "major.minor" (e.g. "10.0.0.0" -> "10.0", but
    # "11.0.0.1" stays intact and "10.0" is left as-is).
    - name: "NBU-EEB-MGMT -> Set-fact NBU version components from EEB readme"
      ansible.builtin.set_fact:
        nbu_version_short: "{{ eeb_readme_nbu_version_register.stdout | regex_replace('^(\\d+\\.\\d+)(\\.0)+$', '\\1') }}"
        nbu_version_short_nodots: "{{ eeb_readme_nbu_version_register.stdout | regex_replace('^(\\d+\\.\\d+)(\\.0)+$', '\\1') | replace('.', '') }}"

    - name: "NBU-EEB-MGMT -> Set-fact EEB tar file name, extracted and backup folder names"
      ansible.builtin.set_fact:
        eeb_tar_file_name: "NetBackup_Unix_x64_{{ nbu_version_short_nodots }}EEB_ET{{ nbu_eeb_file_id }}_{{ nbu_eeb_file_ver }}.tar.gz"
        eeb_tar_extracted_folder_name: "NetBackup_Unix_x64_{{ nbu_version_short_nodots }}EEB_ET{{ nbu_eeb_file_id }}_{{ nbu_eeb_file_ver }}"
        tomcat_backup_folder_path: "{{ os_path_nbu_bkpcomp }}/NetBackup-webserver-{{ nbu_version_short }}-backup"
        tomcat_last_backup_tarball: "{{ os_path_nbu_bkpcomp }}/NetBackup-webserver-last-backup.tar.gz"

    - name: "NBU-EEB-MGMT -> Get the current apache-tomcat server version"
      ansible.builtin.shell: "{{ nbu_tomcat_serverinfo_cmd | replace('LIB_PATH', os_path_nbu_wmc_webserver ~ '/lib') }}"
      register: current_apache_tomcat_version_register
      changed_when: false
      failed_when: false

- name: "NBU-EEB-MGMT -> Performing Tomcat EEB install operations"
  when:
    - ( eeb_task_type == "install" )
    - ( not tomcat_eeb_marker_register.stat.exists )
  block:
    - name: "NBU-EEB-MGMT -> Verify {{ eeb_tar_file_name }} file existence"
      ansible.builtin.stat:
        path: "{{ os_path_openv_tmp }}/{{ eeb_tar_file_name }}"
      register: eeb_tar_file_status_register

    - name: "NBU-EEB-MGMT -> Executing Tomcat EEB internal operations"
      when:
        - eeb_tar_file_status_register.stat.exists
      block:
        - name: "NBU-EEB-MGMT -> Pre-clean any stale extracted folder from prior runs"
          ansible.builtin.file:
            path: "{{ os_path_openv_tmp }}/{{ eeb_tar_extracted_folder_name }}"
            state: absent

        - name: "NBU-EEB-MGMT -> Extracting {{ eeb_tar_file_name }} file to {{ os_path_openv_tmp }}"
          ansible.builtin.unarchive:
            src: "{{ os_path_openv_tmp }}/{{ eeb_tar_file_name }}"
            dest: "{{ os_path_openv_tmp }}"
            remote_src: true

        - name: "NBU-EEB-MGMT -> Running TomcatDeployer.sh"
          ansible.builtin.shell: ( ./TomcatDeployer.sh )
          args:
            chdir: "{{ os_path_openv_tmp }}/{{ eeb_tar_extracted_folder_name }}"
          register: deployer_status_register
          no_log: true
          failed_when: false
          changed_when: false

        - name: "Ansible::Log.info"
          ansible.builtin.assert:
            that: ( deployer_status_register.rc == 0 )
            success_msg:
              - "TomcatDeployer.sh executed successfully for NBU {{ nbu_version }}, Refer below log for more details."
              - "See log on target host: /usr/openv/tmp/TomcatDeployer_{{ nbu_eeb_file_id }}_{{ nbu_eeb_file_ver }}.log"
            fail_msg:
              - "Failed to execute TomcatDeployer.sh for NBU {{ nbu_version }}, Refer below errors and try re-running the playbook."
              - "See log on target host: /usr/openv/tmp/TomcatDeployer_{{ nbu_eeb_file_id }}_{{ nbu_eeb_file_ver }}.log"
              - "stdout (last lines): {{ deployer_status_register.stdout_lines | default([]) }}"
              - "stderr: {{ deployer_status_register.stderr_lines | default([]) }}"
            quiet: true

        - name: "NBU-EEB-MGMT -> Backup and Cleanup operation"
          when:
            - deployer_status_register.rc == 0
          block:
            - name: "NBU-EEB-MGMT -> Verify {{ tomcat_backup_folder_path }} folder existence"
              ansible.builtin.stat:
                path: "{{ tomcat_backup_folder_path }}"
              register: tomcat_backup_folder_stat_register

            - name: "NBU-EEB-MGMT -> Created/Replaced tomcat backup tar file ({{ tomcat_last_backup_tarball }})"
              ansible.builtin.archive:
                path: "{{ tomcat_backup_folder_path }}/*"
                dest: "{{ tomcat_last_backup_tarball }}"
                format: gz
                owner: root
                group: root
                mode: '0400'
              when: tomcat_backup_folder_stat_register.stat.exists

            - name: "NBU-EEB-MGMT -> Remove raw backup directory created by TomcatDeployer"
              ansible.builtin.file:
                path: "{{ tomcat_backup_folder_path }}"
                state: absent
              when: tomcat_backup_folder_stat_register.stat.exists

            # Create the "<id>_<ver>.tomcat" marker file only after a successful
            # TomcatDeployer.sh run. Its presence is checked at the top of this
            # play to skip re-running TomcatDeployer.sh for the same EEB on later
            # playbook executions, keeping Tomcat EEB installs idempotent.
            - name: "NBU-EEB-MGMT -> Creating successful marker file for {{ nbu_eeb_file_id }}"
              ansible.builtin.file:
                path: "{{ os_path_openv_tmp }}/{{ nbu_eeb_file_id }}_{{ nbu_eeb_file_ver }}.tomcat"
                state: touch
                mode: "0644"

            - name: "Ansible::Log.info"
              ansible.builtin.debug:
                msg:
                  - "Prior Tomcat files were backed up to '{{ tomcat_last_backup_tarball }}'."

            - name: "NBU-EEB-MGMT -> Cleanup extracted EEB tar folder {{ eeb_tar_extracted_folder_name }}"
              ansible.builtin.file:
                path: "{{ os_path_openv_tmp }}/{{ eeb_tar_extracted_folder_name }}"
                state: absent

- name: "NBU-EEB-MGMT -> Performing Tomcat EEB rollback operations"
  when:
    - ( eeb_task_type == "uninstall" )
  block:
    - name: "NBU-EEB-MGMT -> Verify Tomcat backup tarball existence"
      ansible.builtin.stat:
        path: "{{ tomcat_last_backup_tarball }}"
      register: tomcat_last_backup_tarball_stat_register

    - name: Ansible::Log.info
      ansible.builtin.assert:
        that:
          - tomcat_last_backup_tarball_stat_register.stat.exists
        fail_msg:
          - "Tomcat rollback failed: The backup tarball 'NetBackup-webserver-last-backup.tar.gz' was not found."
          - >-
            This typically means either the EEB was not originally installed via Ansible,
            or you have already exhausted your single rollback option.
        quiet: true

    # Resolve the web service user/group from bp.conf so restored files get the
    # correct ownership instead of hardcoding nbwebsvc/nbwebgrp.
    - name: "NBU-EEB-MGMT -> Get WEBSVC_USER from bp.conf"
      ansible.builtin.shell: "grep '^WEBSVC_USER' {{ os_file_nbu_bpconf }} | awk '{print $3}'"
      register: websvc_user_register
      changed_when: false

    - name: "NBU-EEB-MGMT -> Get WEBSVC_GROUP from bp.conf"
      ansible.builtin.shell: "grep '^WEBSVC_GROUP' {{ os_file_nbu_bpconf }} | awk '{print $3}'"
      register: websvc_group_register
      changed_when: false

    - name: Ansible::Log.info
      ansible.builtin.assert:
        that:
          - websvc_user_register.stdout | trim | length > 0
          - websvc_group_register.stdout | trim | length > 0
        fail_msg: "Unable to determine WEBSVC_USER/WEBSVC_GROUP from {{ os_file_nbu_bpconf }} - cannot restore Tomcat ownership."
        quiet: true

    - name: "NBU-EEB-MGMT -> Set-fact staging directory path"
      ansible.builtin.set_fact:
        tomcat_staging_dir: "{{ os_path_openv_tmp }}/tomcat_restore_{{ nbu_eeb_file_id }}"

    - name: "NBU-EEB-MGMT -> Create temporary staging directory"
      ansible.builtin.file:
        path: "{{ tomcat_staging_dir }}"
        state: directory
        mode: '0700'

    - name: "NBU-EEB-MGMT -> Extract Tomcat backup tarball to staging directory"
      ansible.builtin.unarchive:
        src: "{{ tomcat_last_backup_tarball }}"
        dest: "{{ tomcat_staging_dir }}"
        remote_src: true

    - name: "NBU-EEB-MGMT -> Remove post-EEB Tomcat bin/lib/conf folders"
      ansible.builtin.file:
        path: "{{ tomcat_folder_item }}"
        state: absent
      loop:
        - "{{ os_path_nbu_wmc_webserver }}/bin"
        - "{{ os_path_nbu_wmc_webserver }}/lib"
        - "{{ os_path_nbu_wsl_webserver }}/conf"
      loop_control:
        loop_var: tomcat_folder_item

    # TomcatDeployer backup layout: bin/, lib/, conf/, and optionally extra_files/ at tarball root.
    # bin/lib -> wmc/webserver; conf -> wsl/webserver/conf; extra_files -> /usr/openv.
    - name: "NBU-EEB-MGMT -> Restore backup bin to wmc/webserver"
      ansible.builtin.copy:
        src: "{{ tomcat_staging_dir }}/bin/"
        dest: "{{ os_path_nbu_wmc_webserver }}/bin/"
        remote_src: true
        mode: preserve

    - name: "NBU-EEB-MGMT -> Restore backup lib to wmc/webserver"
      ansible.builtin.copy:
        src: "{{ tomcat_staging_dir }}/lib/"
        dest: "{{ os_path_nbu_wmc_webserver }}/lib/"
        remote_src: true
        mode: preserve

    # Restore conf into the shared config directory. IMPORTANT: destination is the
    # conf/ subfolder under wsl/webserver (Tomcat expects .../webserver/conf/server.xml).
    - name: "NBU-EEB-MGMT -> Ensure wsl/webserver conf directory exists"
      ansible.builtin.file:
        path: "{{ os_path_nbu_wsl_webserver }}/conf"
        state: directory
        mode: '0755'

    - name: "NBU-EEB-MGMT -> Restore backup conf to wsl/webserver/conf"
      ansible.builtin.copy:
        src: "{{ tomcat_staging_dir }}/conf/"
        dest: "{{ os_path_nbu_wsl_webserver }}/conf/"
        remote_src: true
        mode: preserve

    - name: "NBU-EEB-MGMT -> Stat backup extra_files directory"
      ansible.builtin.stat:
        path: "{{ tomcat_staging_dir }}/extra_files"
      register: tomcat_extra_files_stat_register

    - name: "NBU-EEB-MGMT -> Restore backup extra_files to {{ os_path_nbu_install_default }}"
      ansible.builtin.copy:
        src: "{{ tomcat_staging_dir }}/extra_files/"
        dest: "{{ os_path_nbu_install_default }}/"
        remote_src: true
        mode: preserve
      when: tomcat_extra_files_stat_register.stat.exists

    # Fix ownership of restored bin/lib/conf to the web service user/group.
    - name: "NBU-EEB-MGMT -> Restore ownership of Tomcat bin/lib/conf"
      ansible.builtin.file:
        path: "{{ ownership_item }}"
        owner: "{{ websvc_user_register.stdout | trim }}"
        group: "{{ websvc_group_register.stdout | trim }}"
        recurse: true
      loop:
        - "{{ os_path_nbu_wmc_webserver }}/bin"
        - "{{ os_path_nbu_wmc_webserver }}/lib"
        - "{{ os_path_nbu_wsl_webserver }}/conf"
      loop_control:
        loop_var: ownership_item

    - name: "NBU-EEB-MGMT -> Cleanup temporary staging directory"
      ansible.builtin.file:
        path: "{{ tomcat_staging_dir }}"
        state: absent

    - name: "NBU-EEB-MGMT -> Delete Tomcat backup tarball to enforce single rollback"
      ansible.builtin.file:
        path: "{{ tomcat_last_backup_tarball }}"
        state: absent

    - name: Ansible::Log.info
      ansible.builtin.debug:
        msg:
          - "Tomcat restored from backup '{{ tomcat_last_backup_tarball }}'."
          - "Post-EEB Tomcat bin/lib/conf folders were removed before restore from backup."
          - "The backup tarball and staging directory were deleted after restore."

- name: Ansible::Log.info
  ansible.builtin.assert:
    that:
      - true
    success_msg: "Tomcat rollback completed successfully."
    quiet: true
  when:
    - ( eeb_task_type == "uninstall" )
# EOF
