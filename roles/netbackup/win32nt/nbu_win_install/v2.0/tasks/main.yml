#############################################
#### NetBackup win-install ("Windows") ####
#############################################

# Determine whether the NetBackup software requires install/upgrade
# If no install is required, the workflow will finish after running this task.
- name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Verify the NetBackup software requires install/upgrade"
  ansible.builtin.import_tasks: t01_install_verification.yml

# Import required tasks - Base Install
- name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Load required tasks for NetBackup {{ nbu_role }} {{ nbu_playbook_type }} "
  ansible.builtin.include_tasks: t02_base_install.yml
  when:
    - ( nbu_client_status == "upgrade" or nbu_client_status == "install" )

- name: "NBU-{{ nbu_role | upper }}-{{ nbu_playbook_type | upper }} -> Archive pre-upgrade EEB Patch directory before new-version EEB operations"
  ansible.builtin.include_tasks: t03_archive_patch_on_upgrade.yml

# EOF
