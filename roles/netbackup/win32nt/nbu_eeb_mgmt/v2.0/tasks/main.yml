###########################################################
#### NBU-EEB-MGMT -> tasks -> main.yml ####
###########################################################

- name: "NBU-EEB-MGMT -> NBU services stop block"
  block:
    # Check stop and start executables exist
    - name: "NBU-EEB-MGMT-> Verify NetBackup stop and start executables exist"
      ansible.windows.win_stat:
        path: "{{ netbackup_file }}"
      register: file_exist_status_register
      with_items:
        - "{{ os_path_nbu_install }}\\NetBackup\\bin\\{{ nbu_stop_exe }}"
        - "{{ os_path_nbu_install }}\\NetBackup\\bin\\bpup.exe"
      loop_control:
        loop_var: netbackup_file

    - name: "NBU-EEB-MGMT-> Attempting to stop NetBackup services"
      ansible.windows.win_command: "{{ nbu_stop_cmd }}"
      args:
        chdir: "{{ os_path_nbu_install }}\\NetBackup\\bin"
      failed_when: false
      changed_when: false
      register: nbstop_status_check_register
      until: nbstop_status_check_register.rc | int in [0, 5]
      delay: 5
      retries: 3
      when:
        - nbap_invocation_method == "ansible"
        - file_exist_status_register.results[0].stat.exists

    # Install NetBackup EEBS for the specific NetBackup Version
    - name: "NBU-EEB-MGMT-> Include tasks for NetBackup EEB installation"
      ansible.builtin.include_tasks: t01_base_patch_eeb.yml
      loop: "{{ nbu_eeb_ordered[nbu_version] }}"
      when: nbu_eeb_ordered[nbu_version] is defined

  always:
    # Start the NetBackup daemons, if they are down
    - name: "NBU-EEB-MGMT-> Start NetBackup services"
      ansible.windows.win_command: "bpup.exe -S"
      args:
        chdir: "{{ os_path_nbu_install }}\\NetBackup\\bin"
      failed_when: false
      changed_when: false
      no_log: false
      when:
        - nbap_invocation_method == "ansible"
        - file_exist_status_register.results[1].stat.exists

- name: "NBU-EEB-MGMT-> Check the existence of EEB-Marker path"
  ansible.windows.win_stat:
    path: "{{ os_path_nbu_install }}\\Patch\\EEB-Marker"
  no_log: true
  register: eeb_marker_folder_check_register

- name: "NBU-EEB-MGMT-> Found the existence of EEB-Marker path"
  when: eeb_marker_folder_check_register.stat.exists
  block:
    - name: "NBU-EEB-MGMT-> Get the list of EEB-Markers"
      ansible.windows.win_command: cmd /q /c "for %f in ("*.ini") do (for /f "delims=_ tokens=1,2" %a in ('echo %~nf') do echo SET%a_EEB%b)"
      args:
        chdir: "{{ os_path_nbu_install }}\\Patch\\EEB-Marker"
      register: eeb_marker_installed_list_register
      changed_when: false
      no_log: true
      failed_when: false

    - name: "NBU-EEB-MGMT->  Get the list of installed EEBs"
      ansible.windows.win_command: cmd /q /c "for /f "delims=_ tokens=5,6" %a in ('findstr "Installed" History.log') do echo %a_%b"
      args:
        chdir: "{{ os_path_nbu_install }}\\Patch"
      register: list_of_eebs_installed_register
      changed_when: false
      failed_when: false

    - name: "NBU-EEB-MGMT-> Remove stale EEB-Marker entries"
      ansible.builtin.include_tasks: t02_remove_stale_eeb_marker.yml
      with_items: "{{ eeb_marker_installed_list_register.stdout_lines }}"
      when: item not in list_of_eebs_installed_register.stdout_lines

# EOF
