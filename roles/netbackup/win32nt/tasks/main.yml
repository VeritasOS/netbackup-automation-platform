- name: "NBU-INITIALIZE -> Get installation path from existing registry variable"
  ansible.windows.win_reg_stat:
    path: "{{ nbu_registry_path }}\\CurrentVersion"
    name: "INSTALLDIR"
  register: nbu_install_path_result
  failed_when: false

- name: "NBU-INITIALIZE -> Warning: Custom installation path not allowed during upgrade"
  ansible.builtin.debug:
    msg: "WARNING: As upgrade is being performed, custom path isn't allowed. Hence continuing with installed path ( {{ nbu_install_path_result.value }} )."
  when:
    - nbu_playbook_type is defined
    - nbu_playbook_type == "upgrade"
    - nbu_install_path_result.exists
    - nbu_install_path_result.value is defined
    - nbu_install_path_result.value != ""
    - os_path_nbu_install is defined
    - (nbu_install_path_result.value ) != (os_path_nbu_install )

- name: "NBU-INITIALIZE -> Set installation path from registry"
  ansible.builtin.set_fact:
    os_path_nbu_install: "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}"
    nbu_path_nbcertcmd: "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\NetBackup\\bin\\nbcertcmd.exe"
    os_file_nbu_nbserviceusercmd: "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\NetBackup\\bin\\goodies\\nbserviceusercmd.exe"
    nbu_bin_path: "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\NetBackup\\bin"
    nbu_directory_list_to_be_removed:
      - "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\Help"
      - "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\msg"
      - "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\NetBackup"
      - "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\Patch"
      - "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\pdde"
      - "{{ nbu_install_path_result.value | regex_replace('\\\\$', '') }}\\Security"
  when:
    - nbu_install_path_result.exists
    - nbu_install_path_result.value is defined
    - nbu_install_path_result.value != ""

# Set default Artifactory Respository
- name: "NBU-INITIALIZE -> Set Artifactory Repository based on type of environment as Fact"
  ansible.builtin.set_fact:
    artifactory_repo: ""

# Discover Artifactory Respository based on the type of environment
- name: "NBU-INITIALIZE -> Define Artifactory Repository based on type of environment"
  when: awx_inventory_name is defined and awx_inventory_name != ""
  block:
    - name: "NBU-INITIALIZE -> Define Artifactory Repository - DEV"
      ansible.builtin.set_fact:
        artifactory_repo: yum-enterprise-dev-local
      when: "'DEV' in awx_inventory_name"

    - name: "NBU-INITIALIZE -> Define Artifactory Repository - UAT"
      ansible.builtin.set_fact:
        artifactory_repo: yum-enterprise-test-local
      when: "'UAT' in awx_inventory_name"

    - name: "NBU-INITIALIZE -> Define Artifactory Repository - PROD"
      ansible.builtin.set_fact:
        artifactory_repo: yum-enterprise-prod-local
      when:
        - "'PROD' in awx_inventory_name"

# EOF
