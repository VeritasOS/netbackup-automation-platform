nbap_ansible_system : "{{ 'win32nt' if 'Win32NT' in ansible_system else 'posix' }}"
nbu_max_supported_versions: 7
nbu_versions_supported: "{{ (nbu_pkgs_ordered_list.keys() | list)[0:nbu_max_supported_versions] }}"

# Identifying the ansible invocation method
nbap_invocation_method: "ansible"

