# NetBackup Server - Install - Media Server
- name: NETBACKUP -> MEDIA SERVER INSTALL ("Windows")
  gather_facts: true
  hosts: all
  pre_tasks:
    - name: Retrieving host distribution
      setup:
        gather_subset:
          - "!all"
          - "!min"
          - "distribution"
          - "env"

    - name: "NBU-{{ nbu_role|upper }}-{{ nbu_playbook_type|upper }} -> Load configurable variables"
      ansible.builtin.include_vars: "vars/win32nt.yml"
      tags: ["always"]
      no_log: True
      
  roles:
    - role: 'netbackup'                                # Load netbackup common defaults
    - role: 'netbackup/win32nt'                        # Load netbackup default vars
    - role: 'generic/is_nbu_version_supported'
    - role: 'generic/os_compatibility'
    - role: 'generic/nbu_compatibility'
    - role: 'netbackup/common/evaluate-service-user/v2.0'
    - role: 'netbackup/win32nt/nbu-win-install/v2.0'
    - role: 'netbackup/common/nbu-change-serviceuser/v2.0'
    - role: 'netbackup/common/nbu-get-certificate/v2.0'
    - role: 'generic/nbu_verification'
    - role: 'netbackup/win32nt/nbu-eeb-mgmt/v2.0'

  vars:
    nbu_role: "media"
    nbu_playbook_type: "install"

# EOF
